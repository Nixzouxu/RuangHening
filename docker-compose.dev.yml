services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: innerly
      POSTGRES_PASSWORD: rulexzyx
      POSTGRES_DB: innerly_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata: